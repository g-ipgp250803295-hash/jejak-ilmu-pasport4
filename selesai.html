<!doctype html><html lang="ms"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cop Misi | JEJAK ILMU</title><link rel="stylesheet" href="style.css"></head><body><section class="panel"><div style="font-size:55px">🏅</div><h1 id="heading">Memproses cop misi...</h1><p id="description"></p><p id="total" style="font-weight:bold;color:#884f59"></p><div class="actions"><a id="next" class="btn navy hidden" href="index.html">TERUSKAN PENGEMBARAAN</a><a class="btn" href="index.html">LIHAT PASPORT</a></div><p style="font-size:12px;color:#884f59" id="small"></p></section><script src="app.js"></script><script>
const id=(new URLSearchParams(location.search).get('misi')||'').trim().toLowerCase();const m=MISSIONS.find(x=>x.id===id);const heading=document.getElementById('heading'),desc=document.getElementById('description'),next=document.getElementById('next');
if(m){const ok=mark(m.id);heading.textContent='✓ MISI '+m.title.toUpperCase()+' SELESAI!';desc.textContent=ok?'Tahniah! Cop misi telah direkodkan secara automatik.':'Misi dikenal pasti, tetapi pelayar menghalang penyimpanan. Cuba buka pautan dalam tab biasa.';document.getElementById('total').textContent='Cop terkumpul: '+count()+'/5';next.href=m.next;next.textContent=m.nextLabel+' →';next.classList.remove('hidden');if(m.id==='cabaran')document.getElementById('small').textContent='Jika cukup 5/5 cop, buka pasport untuk menuntut sijil.';}else{heading.textContent='Pautan misi belum lengkap';desc.textContent='Buka halaman ini melalui butang MULA PENGEMBARAAN atau SELESAI MENEROKA di Google Sites.';document.getElementById('small').textContent='Kod diterima: '+(id||'(tiada)')+'. Contoh: selesai.html?misi=mula';}
</script></body></html>
